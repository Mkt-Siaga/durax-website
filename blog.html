<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog Duráximo — Durax</title>
  <meta name="description" content="Blog do Duráximo: dicas de obra para escolher, usar e conservar ferramentas e materiais. Conteúdo publicado no Instagram @duraximo.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&family=League+Gothic&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/pages/blog.css">
  <script src="js/tema.js"></script>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icones/icone-32.png">
  <link rel="apple-touch-icon" href="assets/icones/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#171717">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Durax">
  <meta property="og:title" content="Blog Duráximo — Durax">
  <meta property="og:description" content="Blog do Duráximo: dicas de obra para escolher, usar e conservar ferramentas e materiais. Conteúdo publicado no Instagram @duraximo.">
  <meta property="og:url" content="https://mkt-siaga.github.io/durax-website/blog.html">
  <meta property="og:image" content="https://mkt-siaga.github.io/durax-website/assets/icones/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
</head>
<body>
  <header id="site-header" data-ativo="blog"></header>

  <main>
    <section class="container blog-topo">
      <div class="blog-intro">
        <span class="eyebrow">BLOG DO DURÁXIMO</span>
        <h1 class="display">Dicas de obra</h1>
        <p>Como escolher, usar e conservar ferramentas e materiais, com o Duráximo. Conteúdo publicado no Instagram @duraximo.</p>
      </div>
      <div id="blog-tags" class="blog-tags" role="group" aria-label="Filtrar posts por tag"></div>
    </section>

    <section class="container blog-posts" aria-live="polite">
      <div id="blog-destaque"></div>
      <div id="blog-grade" class="blog-grade"></div>
    </section>

    <section class="blog-siga">
      <div class="container">
        <img src="assets/site/duraximo.webp" alt="Duráximo">
        <span class="blog-siga-texto">Siga <strong>@duraximo</strong> para receber a #DicaDoDuráximo e a #FerramentaDaSemana.</span>
        <a class="btn-contorno" href="https://www.instagram.com/duraximo/" target="_blank" rel="noopener">SEGUIR NO INSTAGRAM</a>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/layout.js"></script>
  <script src="js/blog.js"></script>
</body>
</html>
